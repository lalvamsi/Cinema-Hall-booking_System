services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      SERVE_CLIENT: "true"
      PORT: "5000"
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/cinema_booking}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
